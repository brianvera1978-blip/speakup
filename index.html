// ─── STORAGE (localStorage for GitHub Pages) ───

const getStore = () => {
  try { const d = localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : null; } catch { return null; }
};
const setStore = (data) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) { console.error(e); }
};

const speak = (text, rate = 0.85) => {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v => v.lang.startsWith("en") && v.name.includes("Google")) || voices.find(v => v.lang.startsWith("en"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
};

  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const saved = getStore();
    if (saved) {
      const today = new Date().toDateString();
      if (saved.lastActiveDate) {
        const diff = Math.floor((new Date(today) - new Date(saved.lastActiveDate)) / 86400000);
        if (diff > 1) saved.streak = 0;
      }
      saved.lastActiveDate = today;
      setProgress(saved); setStore(saved);
    } else {
      const init = defaultProgress(); init.lastActiveDate = new Date().toDateString();
      setProgress(init); setStore(init);
    }
    setLoading(false);
    window.speechSynthesis && window.speechSynthesis.getVoices();
  }, []);

  useEffect(() => { if (progress) setStore(progress); }, [progress]);

  const showNotif = (m) => { setNotif(m); setTimeout(() => setNotif(null), 2500); };
  const addXP = (n) => { setProgress(p => ({...p, xp: p.xp + n})); showNotif(`+${n} XP ⚡`); };

  const completeLesson = (day) => {
    setProgress(p => {
      const c = p.completedLessons.includes(day) ? p.completedLessons : [...p.completedLessons, day];
      const nd = Math.max(p.currentDay, day + 1);
      const st = p.streak + (p.completedLessons.includes(day) ? 0 : 1);

      if (st >= 7 && !b.includes("streak_7")) b.push("streak_7");
      if (st >= 30 && !b.includes("streak_30")) b.push("streak_30");
      if (nd > 60 && !b.includes("level_2")) b.push("level_2");

    });

function OralScreen({lesson:l, addXP, goBack}) {
  const [idx, setIdx] = useState(0);
  const [listening, setListening] = useState(false);
  const [result, setResult] = useState(null);
  const [done, setDone] = useState(false);
  const ph = l.oral.phrases[idx];

  const startListen = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){setResult({text:"⚠️ Navegador sin soporte de voz. Usá Chrome.",score:0});return}
    const r = new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=1;
    r.onstart=()=>setListening(true); r.onend=()=>setListening(false);
    r.onerror=()=>{setListening(false);setResult({text:"No te escuché. Intentá de nuevo.",score:0})};
    r.onresult=(e)=>{
      const spoken=e.results[0][0].transcript.toLowerCase().trim();
      const target=ph.text.toLowerCase().trim().split(" ");
      const sw=spoken.split(" ");
      let m=0; target.forEach(w=>{if(sw.includes(w))m++});
      const sc=Math.round((m/target.length)*100);
      setResult({text:spoken,score:sc}); if(sc>=70)addXP(5);
    };
    r.start();
  };
  const next = () => {if(idx<l.oral.phrases.length-1){setIdx(idx+1);setResult(null)}else{setDone(true);addXP(20)}};

    React.createElement("div",{style:S.oralCard},
      React.createElement("p",{style:{fontSize:12,color:"#64748b",marginBottom:4}},"Decí esta frase en inglés:"),
      React.createElement("p",{style:{fontSize:22,fontWeight:700,color:"#f1f5f9",marginBottom:4}},ph.text),
      React.createElement("p",{style:{fontSize:14,color:"#94a3b8",fontStyle:"italic"}},ph.translation),
      React.createElement("button",{style:{...S.smallBtn,marginTop:12},onClick:()=>speak(ph.text,0.75)},React.createElement(Icon,{type:"volume",size:16})," Escuchar primero")
    ),
    React.createElement("button",{style:{...S.micBtn,background:listening?"#ef4444":"linear-gradient(135deg,#f59e0b,#d97706)"},onClick:startListen,disabled:listening},
      React.createElement(Icon,{type:"mic",size:28}),
      React.createElement("span",null,listening?"Escuchando...":"Tocá y hablá")
    ),
    result && React.createElement("div",{style:{...S.resultCard,borderColor:result.score>=70?"#22c55e":result.score>=40?"#f59e0b":"#ef4444"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:8}},
        React.createElement("span",{style:{fontWeight:700,color:"#e2e8f0"}},"Tu pronunciación:"),
        React.createElement("span",{style:{fontWeight:700,color:result.score>=70?"#22c55e":result.score>=40?"#f59e0b":"#ef4444"}},result.score+"%")
      ),
      React.createElement("p",{style:{color:"#cbd5e1",fontSize:14}},'"'+result.text+'"'),
      result.score>=70 && React.createElement("p",{style:{color:"#22c55e",fontSize:13,marginTop:8}},"🎉 ¡Excelente! +5 XP"),
